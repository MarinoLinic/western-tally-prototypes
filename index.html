<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype Library</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand-row">
    <h1 class="brand">Prototype Library</h1>
  </div>

  <div class="controls" role="toolbar" aria-label="Viewer controls">
    <div class="ctl-group proto-nav">
      <button id="prevProto" class="btn" type="button" aria-label="Previous prototype">&lsaquo; Prev</button>
      <select id="protoSelect" aria-label="Prototype"></select>
      <button id="nextProto" class="btn" type="button" aria-label="Next prototype">Next &rsaquo;</button>
    </div>

    <div class="ctl-group">
      <span class="ctl-label" id="viewportLabel">Viewport</span>
      <div class="segmented" id="viewportSeg" role="group" aria-labelledby="viewportLabel"></div>
    </div>

    <div class="ctl-group">
      <span class="ctl-label" id="pageLabel">Page</span>
      <div class="segmented" id="pageSeg" role="group" aria-labelledby="pageLabel"></div>
    </div>

    <div class="ctl-group">
      <span class="ctl-label" id="themeLabel">Theme</span>
      <div class="segmented" id="themeSeg" role="group" aria-labelledby="themeLabel"></div>
    </div>

    <div class="ctl-group">
      <span class="ctl-label" id="zoomLabel">Zoom</span>
      <div class="segmented" id="zoomSeg" role="group" aria-labelledby="zoomLabel"></div>
    </div>

    <div class="ctl-group">
      <span class="ctl-label" id="uiLabel">UI</span>
      <div class="segmented" id="uiSeg" role="group" aria-labelledby="uiLabel"></div>
    </div>

    <a id="openOriginal" class="open-original" href="#" target="_blank" rel="noopener">Open original &#8599;</a>
  </div>
</header>

<main>
  <section class="meta-strip" aria-label="Current capture details">
    <span id="metaNum" class="meta-num">&mdash;</span>
    <span id="metaLabel" class="meta-label"></span>
    <span id="metaDir" class="meta-dir"></span>
    <span id="metaSrc" class="meta-src"></span>
    <span id="metaSpec" class="meta-spec">&mdash;</span>
  </section>

  <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
  <p id="srStatus" class="visually-hidden" aria-live="polite"></p>

  <section class="canvas" id="canvas" aria-label="Screenshot canvas">
    <div class="canvas-inner">
      <span id="stateMsg" class="state-msg" hidden></span>
      <img id="shot" decoding="async" alt="">
    </div>
  </section>
</main>

<footer class="foot">
  <span class="foot-title">Shortcuts</span>
  <span><kbd>&uarr;</kbd>/<kbd>&darr;</kbd> previous / next prototype</span>
  <span><kbd>&larr;</kbd>/<kbd>&rarr;</kbd> previous / next page</span>
  <span><kbd>T</kbd> theme</span>
  <span><kbd>Z</kbd> zoom</span>
  <span><kbd>C</kbd> cinema mode</span>
  <span><kbd>O</kbd> open original</span>
</footer>

<script src="catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
